<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="dogeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Doge Ears -->
  <polygon points="28,45 36,18 52,38" fill="url(#dogeGrad)" stroke="#a16207" stroke-width="2"/>
  <polygon points="92,45 84,18 68,38" fill="url(#dogeGrad)" stroke="#a16207" stroke-width="2"/>
  <!-- Face -->
  <ellipse cx="60" cy="62" rx="40" ry="36" fill="url(#dogeGrad)" stroke="#a16207" stroke-width="2"/>
  <ellipse cx="60" cy="72" rx="26" ry="20" fill="#fef9c3"/>
  <!-- Eyes looking sideways curiously -->
  <ellipse cx="45" cy="54" rx="6" ry="8" fill="#fff" stroke="#713f12" stroke-width="1.5"/>
  <circle cx="47" cy="53" r="3.5" fill="#000"/>
  <ellipse cx="75" cy="54" rx="6" ry="8" fill="#fff" stroke="#713f12" stroke-width="1.5"/>
  <circle cx="77" cy="53" r="3.5" fill="#000"/>
  <!-- Cute Doge Muzzle & nose -->
  <ellipse cx="60" cy="68" rx="6" ry="4" fill="#1c1917"/>
  <path d="M55 74 Q60 78 65 74" stroke="#713f12" stroke-width="2" fill="none"/>
  <!-- Comic sans style phrases -->
  <text x="20" y="20" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" font-weight="bold" fill="#ec4899">so secret</text>
  <text x="80" y="30" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" font-weight="bold" fill="#3b82f6">much anon</text>
  <text x="60" y="110" font-family="Comic Sans MS, cursive, sans-serif" font-size="10" font-weight="bold" fill="#a16207" text-anchor="middle">WOW</text>
</svg>