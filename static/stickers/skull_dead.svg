<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="skullGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <filter id="skullShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#skullShadow)">
    <circle cx="60" cy="52" r="42" fill="url(#skullGrad)"/>
    <rect x="38" y="72" width="44" height="30" rx="10" fill="url(#skullGrad)"/>
  </g>
  <!-- Cross Eyes (Died Laughing) -->
  <g stroke="#0f172a" stroke-width="4" stroke-linecap="round">
    <line x1="38" y1="44" x2="50" y2="56"/>
    <line x1="50" y1="44" x2="38" y2="56"/>
    <line x1="70" y1="44" x2="82" y2="56"/>
    <line x1="82" y1="44" x2="70" y2="56"/>
  </g>
  <!-- Nose cavity -->
  <polygon points="60,63 54,73 66,73" fill="#0f172a"/>
  <!-- Teeth / Grin -->
  <g stroke="#0f172a" stroke-width="3" stroke-linecap="round">
    <line x1="42" y1="88" x2="78" y2="88"/>
    <line x1="48" y1="82" x2="48" y2="95"/>
    <line x1="56" y1="82" x2="56" y2="95"/>
    <line x1="64" y1="82" x2="64" y2="95"/>
    <line x1="72" y1="82" x2="72" y2="95"/>
  </g>
  <!-- Laugh Tears -->
  <path d="M28 50 C24 60 22 72 26 76 C30 80 34 74 34 68 Z" fill="#38bdf8"/>
  <path d="M92 50 C96 60 98 72 94 76 C90 80 86 74 86 68 Z" fill="#38bdf8"/>
</svg>