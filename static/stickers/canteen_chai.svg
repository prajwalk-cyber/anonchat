<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="chaiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Cutting Chai Glass -->
  <polygon points="40,32 80,32 72,88 48,88" fill="url(#chaiGrad)" stroke="#78350f" stroke-width="3"/>
  <polygon points="44,48 76,48 72,85 48,85" fill="#d97706"/>
  <!-- Glass rim highlights -->
  <line x1="38" y1="32" x2="82" y2="32" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  <!-- Samosa next to it -->
  <polygon points="84,72 108,88 78,88" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <!-- Text -->
  <text x="60" y="108" font-family="Impact, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" letter-spacing="1">CHAI + SAMOSA</text>
</svg>